job:
  id: e2e-timeouts
source:
  url_env: E2E_SOURCE_URL
  publication: pub_timeouts
  slot: slot_timeouts
target:
  url_env: E2E_TARGET_URL
replication:
  tables:
    - e2e_timeouts.accounts
    - e2e_timeouts.events
resources:
  connection_timeout: 5s
  feedback_interval: 1s
  retry_backoff:
    initial: 200ms
    max: 2s

safety:
  monitor_interval: 2s

