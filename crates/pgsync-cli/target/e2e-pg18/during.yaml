job:
  id: e2e-during
source:
  url_env: E2E_SOURCE_URL
  publication: pub_during
  slot: slot_during
target:
  url_env: E2E_TARGET_URL
replication:
  tables:
    - e2e_during.accounts
    - e2e_during.events
resources:
  connection_timeout: 5s
  feedback_interval: 1s
  retry_backoff:
    initial: 200ms
    max: 2s
  max_parallel_copies: 1
safety:
  monitor_interval: 2s

