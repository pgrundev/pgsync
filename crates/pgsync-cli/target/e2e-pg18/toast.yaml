job:
  id: e2e-toast
source:
  url_env: E2E_SOURCE_URL
  publication: pub_toast
  slot: slot_toast
target:
  url_env: E2E_TARGET_URL
replication:
  tables:
    - e2e_toast.accounts
    - e2e_toast.events
resources:
  connection_timeout: 5s
  feedback_interval: 1s
  retry_backoff:
    initial: 200ms
    max: 2s

safety:
  monitor_interval: 2s

