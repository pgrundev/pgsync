job:
  id: e2e-tgtdisc
source:
  url_env: E2E_SOURCE_URL
  publication: pub_tgtdisc
  slot: slot_tgtdisc
target:
  url_env: E2E_TARGET_URL
replication:
  tables:
    - e2e_tgtdisc.accounts
    - e2e_tgtdisc.events
resources:
  connection_timeout: 5s
  feedback_interval: 1s
  retry_backoff:
    initial: 200ms
    max: 2s

safety:
  monitor_interval: 2s

