job:
  id: e2e-ddl
source:
  url_env: E2E_SOURCE_URL
  publication: pub_ddl
  slot: slot_ddl
target:
  url_env: E2E_TARGET_URL
replication:
  tables:
    - e2e_ddl.accounts
    - e2e_ddl.events
resources:
  connection_timeout: 5s
  feedback_interval: 1s
  retry_backoff:
    initial: 200ms
    max: 2s

safety:
  monitor_interval: 2s

