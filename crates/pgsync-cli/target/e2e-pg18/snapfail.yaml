job:
  id: e2e-snapfail
source:
  url_env: E2E_SOURCE_URL
  publication: pub_snapfail
  slot: slot_snapfail
target:
  url_env: E2E_TARGET_URL
replication:
  tables:
    - e2e_snapfail.accounts
    - e2e_snapfail.events
resources:
  connection_timeout: 5s
  feedback_interval: 1s
  retry_backoff:
    initial: 200ms
    max: 2s

safety:
  monitor_interval: 2s

